<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNI Jetkings · Updated Deck</title>
<style>
  :root { --red: #CF2030; --red-dark: #A91826; --ink: #1c1f2a; --muted: #5d6475; --line: #dfe2ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #e9ebf1; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: #fff; border-bottom: 3px solid var(--red); flex-wrap: wrap; }
  .brand { font-weight: 800; letter-spacing: .02em; color: var(--red); font-size: 20px; }
  .brand small { display: block; font-weight: 600; font-size: 11px; color: var(--muted); letter-spacing: .12em; margin-top: -2px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; min-width: 140px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; color: var(--ink); text-decoration: none; }
  .btn:hover { background: #fafbfd; border-color: #b9bfce; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: var(--red-dark); }
  iframe { flex: 1; width: 100%; border: 0; background: #e9ebf1; }
  .note { display: none; padding: 40px 20px; text-align: center; color: var(--muted); }

  .pwmask { position: fixed; inset: 0; background: rgba(20,24,36,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .pwmask.on { display: flex; }
  .pwbox { background: #fff; border-radius: 12px; padding: 22px; width: 100%; max-width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .pwbox h2 { margin: 0 0 4px; font-size: 18px; }
  .pwbox p { margin: 0 0 12px; color: #5d6475; font-size: 14px; }
  .pwbox input[type=password], .pwbox input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #dfe2ea; border-radius: 8px; font: inherit; }
  .pwbox .err { color: #CF2030; font-size: 13px; min-height: 18px; margin-top: 6px; }
  .pwbox .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  .search { position: relative; flex: 0 1 320px; min-width: 200px; }
  .search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .search input:focus { outline: 2px solid var(--red); border-color: var(--red); }
  .results { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 55vh; overflow: auto; z-index: 30; display: none; }
  .results.on { display: block; }
  .results button { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 9px 12px; font: inherit; cursor: pointer; border-bottom: 1px solid #f0f1f5; }
  .results button:last-child { border-bottom: 0; }
  .results button:hover, .results button.act { background: #fdecee; }
  .results b { display: block; }
  .results small { color: var(--muted); }
  .results .none { padding: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">BNI <small>JETKINGS</small></div>
    <h1>Updated deck · view only</h1>
    <div class="search">
      <input id="q" type="search" placeholder="Search your name to jump to your slide" autocomplete="off" aria-label="Search presenter name">
      <div class="results" id="res" role="listbox"></div>
    </div>
    <a class="btn" href="/">Back</a>
    <a class="btn" href="/deck.pdf" target="_blank" rel="noopener">Open full screen</a>
    <a class="btn primary" href="/deck.pdf?download=1">Download PDF</a>
    <button class="btn" id="btnPpt" type="button">Download PPT 🔒</button>
  </header>
  <iframe id="f" title="Updated deck" src="/deck.pdf#view=FitH"></iframe>
  <div class="note" id="note">Your browser can't show the deck here. Use <b>Open full screen</b> or <b>Download PDF</b> above.</div>
<script>
  // ---- search a presenter's name -> jump to that slide in the deck
  var people = [], q = document.getElementById('q'), res = document.getElementById('res'), act = -1, shown = [];
  fetch('/api/deck-index').then(function (r) { return r.ok ? r.json() : []; }).then(function (d) { people = d; }).catch(function () {});
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function render() {
    var t = q.value.trim().toLowerCase();
    if (!t) { res.classList.remove('on'); return; }
    var words = t.split(/\s+/);
    shown = people.filter(function (p) {
      var hay = (p.name + ' ' + p.company + ' ' + p.category).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    }).slice(0, 12);
    act = shown.length ? 0 : -1;
    res.innerHTML = shown.length ? shown.map(function (p, i) {
      return '<button type="button" data-i="' + i + '" class="' + (i === 0 ? 'act' : '') + '"><b>' + esc(p.name) + '</b><small>' +
        esc([p.company, p.category].filter(Boolean).join(' · ')) + ' · page ' + p.page + '</small></button>';
    }).join('') : '<div class="none">No presenter found. Check the spelling.</div>';
    res.classList.add('on');
  }
  function go(p) {
    res.classList.remove('on'); q.value = p.name;
    var url = '/deck.pdf#page=' + p.page + '&view=FitH';
    var old = document.getElementById('f');
    if (old.style.display === 'none') { window.open(url, '_blank'); return; }   // phones: open in a new tab
    var fresh = document.createElement('iframe');                               // a fresh frame always lands on the page
    fresh.id = 'f'; fresh.title = 'Updated deck'; fresh.src = url;
    old.parentNode.replaceChild(fresh, old);
  }
  q.addEventListener('input', render);
  q.addEventListener('focus', render);
  q.addEventListener('keydown', function (e) {
    var b = res.querySelectorAll('button');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!b.length) return; e.preventDefault();
      act = (act + (e.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length;
      b.forEach(function (x, i) { x.classList.toggle('act', i === act); }); b[act].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); if (shown[act]) go(shown[act]); }
    else if (e.key === 'Escape') { res.classList.remove('on'); }
  });
  res.addEventListener('mousedown', function (e) { var b = e.target.closest('button'); if (b) { e.preventDefault(); go(shown[+b.dataset.i]); } });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) res.classList.remove('on'); });

  // ---- password-protected PowerPoint download
  function askPptPassword(getExtra) {
    const mask = document.getElementById('pwMask'), input = document.getElementById('pwInput');
    const err = document.getElementById('pwErr'), go = document.getElementById('pwGo');
    const close = () => { mask.classList.remove('on'); input.value = ''; err.textContent = ''; };
    input.value = ''; err.textContent = ''; mask.classList.add('on'); input.focus();
    document.getElementById('pwCancel').onclick = close;
    mask.onclick = (e) => { if (e.target === mask) close(); };
    document.getElementById('pwForm').onsubmit = async (e) => {
      e.preventDefault();
      go.disabled = true; go.textContent = 'Preparing…'; err.textContent = '';
      try {
        const res = await fetch('/api/export/deck.pptx', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value, ...(getExtra ? getExtra() : {}) }) });
        if (!res.ok) {
          let msg = 'Could not download. Please try again.';
          try { msg = (await res.json()).message || msg; } catch (_) {}
          err.textContent = msg; input.select(); return;
        }
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'BNI-Jetkings-OCT-updated.pptx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        close();
      } catch (_) { err.textContent = 'Network problem. Please try again.'; }
      finally { go.disabled = false; go.textContent = 'Download PPT'; }
    };
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('pwCancel').click(); });
  document.getElementById('btnPpt').addEventListener('click', () => askPptPassword());

  // Phones usually can't show a PDF inside a page - fall back to the buttons.
  var nav = navigator, ok = nav.pdfViewerEnabled !== false;
  if (!ok) { document.getElementById('f').style.display = 'none'; document.getElementById('note').style.display = 'block'; }
</script>

<div class="pwmask" id="pwMask" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
  <form class="pwbox" id="pwForm" autocomplete="off">
    <h2 id="pwTitle">Download PowerPoint</h2>
    <p>Enter the password to download the updated deck as a .pptx file.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off" required>
    <div class="err" id="pwErr" role="alert"></div>
    <div class="row">
      <button type="button" class="btn" id="pwCancel">Cancel</button>
      <button type="submit" class="btn primary" id="pwGo">Download PPT</button>
    </div>
  </form>
</div>
</body>
</html>
